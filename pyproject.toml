[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hcmtwin"
version = "0.1.0"
description = "Mechanistic digital twin of a hypertrophic cardiomyopathy ventricle under myosin-inhibitor dosing, built to test parameter identifiability from non-invasive measurements."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "hcm-twin contributors" }]
keywords = ["cardiac", "hypertrophic-cardiomyopathy", "mavacamten", "identifiability", "systems-biology"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "pandas>=2.1,<3",
  "SALib>=1.5.0,<2",
  "emcee>=3.1.4,<4",
  "scikit-learn>=1.4,<2",
  "matplotlib>=3.8,<4",
  "plotly>=5.20,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-xdist>=3.5",
  "ruff>=0.6",
  "mypy>=1.10",
  "hypothesis>=6.100",
  "jupyter>=1.0",
  "nbclient>=0.10",
  "nbformat>=5.10",
]

[project.scripts]
hcmtwin = "hcmtwin.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hcmtwin"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY", "RUF"]
ignore = ["E741", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# dashboard.py embeds the explorer's HTML, CSS and JavaScript as a template string.
# Rewrapping that to Python's line length would make the markup harder to read, not easier.
"src/hcmtwin/viz/dashboard.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src/hcmtwin"]
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: marks tests that take more than a couple of seconds",
]
filterwarnings = ["ignore::DeprecationWarning"]
